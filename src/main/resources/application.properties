spring.datasource.url=jdbc:mysql://localhost:3306/internship_db
spring.datasource.username=root
spring.datasource.password=student
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ======================
# MongoDB Configuration
# ======================
spring.data.mongodb.uri=mongodb://localhost:27017/smart_education_mongo
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=smart_education_mongo
# Enable debug logging for MongoDB
logging.level.org.springframework.data.mongodb=DEBUG
